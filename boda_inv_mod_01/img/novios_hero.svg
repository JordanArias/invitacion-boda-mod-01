<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFE5D8"/>
      <stop offset="35%" stop-color="#E7DAC8"/>
      <stop offset="70%" stop-color="#DFCFB9"/>
      <stop offset="100%" stop-color="#FAF8F5"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#FDFBF7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D9C7B0" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#F6EFE6" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#EDE2D2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sageLeaves" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#82967F"/>
      <stop offset="50%" stop-color="#5B7053"/>
      <stop offset="100%" stop-color="#3D4D3E"/>
    </linearGradient>
    <linearGradient id="terracottaRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C49A78"/>
      <stop offset="50%" stop-color="#A67C52"/>
      <stop offset="100%" stop-color="#7A5836"/>
    </linearGradient>
    <linearGradient id="veilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FAF8F5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Fondo degradado cielo dorado / lino -->
  <rect width="1200" height="800" fill="url(#skyGrad)"/>
  <rect width="1200" height="800" fill="url(#sunGlow)"/>

  <!-- Resplandor solar suave -->
  <circle cx="600" cy="200" r="280" fill="url(#warmLight)" filter="url(#softBlur)"/>

  <!-- Siluetas y Arcos Arquitectónicos Nupciales de Fondo -->
  <path d="M400,600 C400,320 800,320 800,600 L840,650 L360,650 Z" fill="#E8DEC9" opacity="0.35"/>
  <path d="M460,600 C460,370 740,370 740,600 Z" fill="#EFE8D8" opacity="0.45"/>

  <!-- Velo de Novia y Formas Fluidas de Amor -->
  <path d="M520,240 C580,260 680,270 730,360 C780,450 720,540 680,620 C640,700 560,720 500,660 C440,600 480,480 520,380 Z" fill="url(#veilGrad)"/>

  <!-- Pareja Nupcial en Estilo Editorial Minimalista -->
  <!-- Novio en esmoquin elegante / silueta estilizada -->
  <path d="M530,300 C525,285 535,260 550,250 C565,240 580,245 585,260 C590,275 580,295 565,305 C555,310 540,310 530,300 Z" fill="#524842" opacity="0.85"/>
  <path d="M525,305 L575,305 L590,440 L510,440 Z" fill="#3D3531" opacity="0.85"/>
  <path d="M542,305 L555,340 L560,305 Z" fill="#FFFFFF" opacity="0.9"/>
  <!-- Corbata michi / lazo -->
  <circle cx="552" cy="312" r="3" fill="#A67C52"/>

  <!-- Novia en vestido nupcial con velo translúcido -->
  <path d="M595,305 C590,290 600,265 615,255 C630,245 645,250 650,265 C655,280 645,300 630,310 C620,315 605,315 595,305 Z" fill="#75675F" opacity="0.8"/>
  <path d="M590,310 C610,310 630,320 635,345 C640,370 660,420 675,480 C690,540 685,600 640,650 C600,690 570,680 560,650 C550,620 575,480 580,410 C585,360 580,315 590,310 Z" fill="#FFFFFF" opacity="0.95"/>
  <!-- Textura del encaje del vestido -->
  <path d="M588,340 Q615,360 635,345 Q645,385 625,410 Q600,380 588,340 Z" fill="#FBF9F5" opacity="0.85"/>

  <!-- Ramo nupcial botánico de flores terracota y eucalipto -->
  <g transform="translate(560, 390)">
    <circle cx="15" cy="15" r="14" fill="url(#terracottaRose)"/>
    <circle cx="32" cy="12" r="12" fill="#E2B89D"/>
    <circle cx="24" cy="28" r="13" fill="url(#terracottaRose)"/>
    <circle cx="5" cy="22" r="10" fill="#EFE5D8"/>
    <!-- Hojas de eucalipto -->
    <path d="M0,10 Q-15,5 -20,20 Q-5,22 0,10 Z" fill="url(#sageLeaves)"/>
    <path d="M35,2 Q48,-8 50,10 Q38,15 35,2 Z" fill="url(#sageLeaves)"/>
    <path d="M25,35 Q30,55 15,52 Q18,40 25,35 Z" fill="url(#sageLeaves)"/>
    <circle cx="18" cy="20" r="3" fill="#D8BE7A"/>
    <circle cx="30" cy="24" r="2.5" fill="#D8BE7A"/>
  </g>

  <!-- Rama decorativa superior izquierda (Eucalipto & Olivo) -->
  <g transform="translate(50, 40) scale(1.4)">
    <path d="M0,0 C80,40 180,50 250,10" fill="none" stroke="#A8977E" stroke-width="2" opacity="0.6"/>
    <path d="M60,18 C80,5 95,20 85,35 C70,40 55,30 60,18 Z" fill="url(#sageLeaves)" opacity="0.8"/>
    <path d="M120,30 C145,20 155,35 145,50 C130,55 115,45 120,30 Z" fill="url(#sageLeaves)" opacity="0.75"/>
    <path d="M180,32 C205,25 210,40 200,55 C185,60 175,45 180,32 Z" fill="url(#terracottaRose)" opacity="0.7"/>
    <circle cx="105" cy="25" r="3.5" fill="#D8BE7A"/>
    <circle cx="165" cy="36" r="3.5" fill="#D8BE7A"/>
  </g>

  <!-- Rama decorativa superior derecha -->
  <g transform="translate(1150, 40) scale(-1.4, 1.4)">
    <path d="M0,0 C80,40 180,50 250,10" fill="none" stroke="#A8977E" stroke-width="2" opacity="0.6"/>
    <path d="M60,18 C80,5 95,20 85,35 C70,40 55,30 60,18 Z" fill="url(#sageLeaves)" opacity="0.8"/>
    <path d="M120,30 C145,20 155,35 145,50 C130,55 115,45 120,30 Z" fill="url(#sageLeaves)" opacity="0.75"/>
    <path d="M180,32 C205,25 210,40 200,55 C185,60 175,45 180,32 Z" fill="url(#terracottaRose)" opacity="0.7"/>
    <circle cx="105" cy="25" r="3.5" fill="#D8BE7A"/>
    <circle cx="165" cy="36" r="3.5" fill="#D8BE7A"/>
  </g>

  <!-- Partículas doradas suspendidas -->
  <g opacity="0.7">
    <circle cx="280" cy="180" r="2.5" fill="#D8BE7A"/>
    <circle cx="340" cy="260" r="2" fill="#D8BE7A"/>
    <circle cx="450" cy="150" r="3" fill="#E5CF98"/>
    <circle cx="750" cy="160" r="3" fill="#E5CF98"/>
    <circle cx="860" cy="240" r="2" fill="#D8BE7A"/>
    <circle cx="920" cy="190" r="2.5" fill="#D8BE7A"/>
  </g>

  <!-- Degradado inferior suave hacia el fondo de lino -->
  <rect y="640" width="1200" height="160" fill="url(#skyGrad)" opacity="0.95"/>
</svg>
