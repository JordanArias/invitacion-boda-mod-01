<!DOCTYPE html>
<html class="h-full" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0" name="viewport"/>
  <title>Boda Andrés &amp; Margot - Bienvenida</title>
  
  <!-- Tailwind CSS v3 CDN with plugins -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Google Fonts for Editorial Luxury & Calligraphy -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&amp;family=Montserrat:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            linen: '#FAF7F2',
            champagne: '#EFE9DE',
            terracotta: {
              DEFAULT: '#A67C52',
              hover: '#936C45',
              dark: '#7A5836'
            },
            sage: {
              light: '#8FA382',
              DEFAULT: '#5B7053',
              dark: '#3E5039'
            },
            gold: {
              light: '#E2CA9C',
              DEFAULT: '#C5A869',
              dark: '#9E8043'
            }
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'serif'],
            script: ['"Alex Brush"', 'cursive'],
            sans: ['"Montserrat"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Custom Styles -->
  <style>
    /* Subtle luxury linen and paper grain effect */
    .bg-linen-texture {
      background-color: #FAF7F2;
      background-image: 
        radial-gradient(#d3c8b4 0.6px, transparent 0.6px),
        radial-gradient(#ede4d3 0.6px, #faf7f2 0.6px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }

    @keyframes gentlePulse {
      0%, 100% {
        transform: translateY(0);
        opacity: 0.35;
      }
      50% {
        transform: translateY(7px);
        opacity: 0.85;
      }
    }

    @keyframes subtleGlow {
      0%, 100% {
        filter: drop-shadow(0 0 1px rgba(197, 168, 105, 0.25));
      }
      50% {
        filter: drop-shadow(0 0 8px rgba(197, 168, 105, 0.5));
      }
    }

    .animate-bounce-slow {
      animation: gentlePulse 2.6s ease-in-out infinite;
    }

    .gold-glow {
      animation: subtleGlow 4s ease-in-out infinite;
    }

    /* Elegant exit transition */
    .portal-closing {
      transform: scale(0.93) translateY(-10px);
      opacity: 0;
      filter: blur(4px);
      transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    /* Elegant entry animation */
    .fade-enter {
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.98);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body class="min-h-full bg-stone-900 flex justify-center items-center m-0 p-0 antialiased select-none font-sans overflow-x-hidden">
  
  <!-- Mobile & Responsive Card Container -->
  <main id="invite-container" class="fade-enter relative w-full max-w-[420px] min-h-[100dvh] bg-linen-texture flex flex-col justify-between items-center px-6 py-8 sm:py-10 shadow-2xl overflow-hidden transition-all duration-700 sm:rounded-2xl sm:my-6 sm:min-h-[850px] border border-stone-200/50">
    
    <!-- Top decorative space & header -->
    <header class="w-full flex justify-between items-center opacity-60 px-2 pt-1 text-xs tracking-widest uppercase font-serif text-stone-600">
      <span>Nuestra Boda</span>
      <span class="tracking-widest font-sans font-light">09 · 07 · 2025</span>
    </header>

    <!-- Central Wreath And Monogram Section -->
    <section class="relative flex flex-col items-center justify-center my-auto w-full max-w-[320px] aspect-square" data-purpose="monogram-emblem">
      <!-- Circular Botanical SVG Frame with soft metallic gradients & olive leaves -->
      <svg aria-hidden="true" class="absolute inset-0 w-full h-full gold-glow pointer-events-none" fill="none" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="goldRing" x1="50" y1="40" x2="350" y2="360" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#DEB887" stop-opacity="0.5"></stop>
            <stop offset="35%" stop-color="#C5A869" stop-opacity="0.95"></stop>
            <stop offset="65%" stop-color="#F2DEB0" stop-opacity="1"></stop>
            <stop offset="100%" stop-color="#A58448" stop-opacity="0.6"></stop>
          </linearGradient>
          <linearGradient id="sageLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#95A88F" stop-opacity="0.8"></stop>
            <stop offset="50%" stop-color="#6F8567" stop-opacity="0.85"></stop>
            <stop offset="100%" stop-color="#4F644A" stop-opacity="0.9"></stop>
          </linearGradient>
          <linearGradient id="eucalyptusBlush" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#C3A595" stop-opacity="0.5"></stop>
            <stop offset="100%" stop-color="#849980" stop-opacity="0.85"></stop>
          </linearGradient>
          <linearGradient id="softStem" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#B2A183"></stop>
            <stop offset="100%" stop-color="#847355"></stop>
          </linearGradient>
        </defs>

        <!-- Multi-Ring Geometric Base -->
        <circle cx="200" cy="198" r="142" stroke="url(#goldRing)" stroke-width="1.6" opacity="0.85"></circle>
        <circle cx="203" cy="201" r="148" stroke="url(#goldRing)" stroke-width="1.2" stroke-dasharray="320 6" opacity="0.6"></circle>
        <circle cx="196" cy="195" r="136" stroke="#D1B880" stroke-width="0.8" opacity="0.45"></circle>

        <!-- Botanical Leaves (Top-Right Wreath Cluster) -->
        <g class="botanical-branch-top-right">
          <path d="M 230 65 C 290 85 345 135 352 205" fill="none" stroke="url(#softStem)" stroke-linecap="round" stroke-width="1.2"></path>
          <path d="M 255 75 C 265 60 285 62 292 73 C 285 88 268 85 255 75 Z" fill="url(#sageLeafGrad)"></path>
          <line x1="258" y1="75" x2="286" y2="72" stroke="#485B43" stroke-width="0.6" opacity="0.7"></line>
          <path d="M 285 92 C 305 82 322 92 320 108 C 304 115 292 105 285 92 Z" fill="url(#eucalyptusBlush)"></path>
          <path d="M 315 125 C 335 120 348 135 345 152 C 330 155 320 142 315 125 Z" fill="url(#sageLeafGrad)"></path>
          <line x1="318" y1="128" x2="341" y2="145" stroke="#485B43" stroke-width="0.5" opacity="0.7"></line>
          <path d="M 335 160 C 358 160 366 178 358 195 C 344 192 338 178 335 160 Z" fill="url(#sageLeafGrad)"></path>
          <path d="M 345 200 C 362 210 358 230 346 242 C 336 230 336 215 345 200 Z" fill="url(#eucalyptusBlush)" opacity="0.9"></path>
          <circle cx="280" cy="80" r="2.2" fill="#D8BE7A"></circle>
          <circle cx="310" cy="114" r="2" fill="#D8BE7A"></circle>
          <circle cx="342" cy="175" r="2.5" fill="#D8BE7A"></circle>
          <circle cx="330" cy="225" r="1.8" fill="#C5A869"></circle>
        </g>

        <!-- Botanical Leaves (Bottom-Left Wreath Cluster) -->
        <g class="botanical-branch-bottom-left">
          <path d="M 170 338 C 110 320 60 265 52 195" fill="none" stroke="url(#softStem)" stroke-linecap="round" stroke-width="1.2"></path>
          <path d="M 150 325 C 135 340 115 338 108 327 C 115 312 132 315 150 325 Z" fill="url(#sageLeafGrad)"></path>
          <line x1="145" y1="324" x2="114" y2="328" stroke="#485B43" stroke-width="0.6" opacity="0.7"></line>
          <path d="M 115 308 C 95 318 78 308 80 292 C 96 285 108 295 115 308 Z" fill="url(#eucalyptusBlush)"></path>
          <path d="M 85 275 C 65 280 52 265 55 248 C 70 245 80 258 85 275 Z" fill="url(#sageLeafGrad)"></path>
          <line x1="82" y1="272" x2="59" y2="255" stroke="#485B43" stroke-width="0.5" opacity="0.7"></line>
          <path d="M 65 240 C 42 240 34 222 42 205 C 56 208 62 222 65 240 Z" fill="url(#eucalyptusBlush)"></path>
          <path d="M 55 200 C 38 190 42 170 54 158 C 64 170 64 185 55 200 Z" fill="url(#sageLeafGrad)"></path>
          <circle cx="120" cy="320" r="2.2" fill="#D8BE7A"></circle>
          <circle cx="90" cy="286" r="2" fill="#D8BE7A"></circle>
          <circle cx="58" cy="225" r="2.5" fill="#D8BE7A"></circle>
          <circle cx="70" cy="175" r="1.8" fill="#C5A869"></circle>
        </g>
      </svg>

      <!-- Monogram and Wedding Date Typography container -->
      <div class="relative z-10 flex flex-col items-center justify-center text-center px-4">
        <!-- Calligraphic Monogram 'A y M' -->
        <div class="font-script text-6xl sm:text-7xl tracking-wide select-none transform hover:scale-105 transition-transform duration-500 py-1" style="color: #795F45;">
          <span class="inline-block transform -translate-x-1">A</span>
          <span class="font-serif italic font-normal text-3xl sm:text-4xl px-2 opacity-80 inline-block align-middle" style="color: #9A7B56;">y</span>
          <span class="inline-block transform translate-x-1">M</span>
        </div>
        
        <!-- Wedding Date with delicate typography separation -->
        <time class="mt-2 font-serif text-lg tracking-[0.22em] text-[#8C6F4F] font-medium" datetime="2025-07-09">
          09 · 07 · 2025
        </time>
      </div>
    </section>

    <!-- Bottom Actions and Entry Button -->
    <footer class="w-full flex flex-col items-center gap-5 pb-4">
      <!-- Animated downward indicator icon -->
      <div aria-hidden="true" class="animate-bounce-slow flex flex-col items-center justify-center text-stone-400 cursor-default">
        <svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path d="M19.5 8.25l-7.5 7.5-7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </div>

      <!-- Main Action Button in refined terracotta tone -->
      <button id="enter-button" type="button" class="group relative w-full max-w-[290px] py-4 px-6 rounded-full bg-[#A67C52] hover:bg-[#936C45] active:bg-[#7D5B38] text-white font-serif tracking-[0.08em] text-[17px] text-center shadow-lg shadow-[#a67c5240] hover:shadow-xl hover:shadow-[#a67c5255] transition-all duration-300 transform active:scale-95 focus:outline-none focus:ring-2 focus:ring-[#C5A869] focus:ring-offset-2 overflow-hidden">
        <span class="relative z-10 flex items-center justify-center gap-2">
          <span id="button-label">Ingresar a mi invitación</span>
          <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
          </svg>
        </span>
        <!-- Button subtle shine effect -->
        <span class="absolute inset-0 -translate-x-full group-hover:translate-x-full duration-1000 bg-gradient-to-r from-transparent via-white/20 to-transparent transition-all"></span>
      </button>

      <!-- Discreet RSVP / Couple tag -->
      <p class="font-serif italic text-sm text-stone-500 tracking-wider">
        Andrés &amp; Margot
      </p>
    </footer>

  </main>

  <!-- Navigation & Transition Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const enterBtn = document.getElementById('enter-button');
      const container = document.getElementById('invite-container');
      const btnLabel = document.getElementById('button-label');
      let isNavigating = false;

      if (enterBtn && container) {
        enterBtn.addEventListener('click', (e) => {
          e.preventDefault();
          if (isNavigating) return;
          isNavigating = true;

          // Haptic feedback if supported
          if (navigator.vibrate) {
            navigator.vibrate(35);
          }

          // Visual feedback on button
          if (btnLabel) {
            btnLabel.textContent = 'Abriendo invitación...';
          }
          enterBtn.classList.add('opacity-90', 'cursor-wait');

          // Apply elegant transition: scale down & fade out (650ms duration)
          container.classList.add('portal-closing');

          // Smooth navigation to invitacion.html
          setTimeout(() => {
            window.location.href = 'invitacion.html';
          }, 650);
        });
      }
    });
  </script>
</body>
</html>
