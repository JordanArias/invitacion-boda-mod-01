<!DOCTYPE html>

<html class="h-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Invitación de Boda - Andrés &amp; Margot</title>
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for Editorial Luxury & Calligraphy -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&amp;family=Montserrat:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            linen: '#FAF7F2',
            champagne: '#EFE9DE',
            terracotta: {
              DEFAULT: '#A67C52',
              hover: '#936C45',
              dark: '#7A5836'
            },
            sage: {
              light: '#8FA382',
              DEFAULT: '#5B7053',
              dark: '#3E5039'
            },
            gold: {
              light: '#E2CA9C',
              DEFAULT: '#C5A869',
              dark: '#9E8043'
            }
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'serif'],
            script: ['"Alex Brush"', 'cursive'],
            sans: ['"Montserrat"', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="background-texture">
    /* Subtle luxury linen and paper grain effect */
    .bg-linen-texture {
      background-color: #FAF7F2;
      background-image: 
        radial-gradient(#d3c8b4 0.6px, transparent 0.6px),
        radial-gradient(#ede4d3 0.6px, #faf7f2 0.6px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }
  </style>
<style data-purpose="micro-animations">
    @keyframes gentlePulse {
      0%, 100% {
        transform: translateY(0);
        opacity: 0.35;
      }
      50% {
        transform: translateY(6px);
        opacity: 0.8;
      }
    }

    @keyframes subtleGlow {
      0%, 100% {
        filter: drop-shadow(0 0 1px rgba(197, 168, 105, 0.2));
      }
      50% {
        filter: drop-shadow(0 0 7px rgba(197, 168, 105, 0.45));
      }
    }

    .animate-bounce-slow {
      animation: gentlePulse 2.8s ease-in-out infinite;
    }

    .gold-glow {
      animation: subtleGlow 4s ease-in-out infinite;
    }

    /* Screen transition fade out */
    .portal-closing {
      transform: scale(0.96);
      opacity: 0;
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="h-full bg-stone-900 flex justify-center items-center m-0 p-0 antialiased select-none font-sans overflow-hidden">
<!-- BEGIN: MobileDeviceContainer -->
<!-- Constrained strictly to mobile phone dimensions for authentic iOS experience -->
<main class="relative w-full max-w-[420px] h-[100dvh] max-h-[890px] bg-linen-texture flex flex-col justify-between items-center px-6 py-10 shadow-2xl overflow-hidden transition-all duration-700" data-purpose="mobile-card-container" id="invite-container">
<!-- Top decorative space & status indicator for iOS style header alignment -->
<header class="w-full flex justify-between items-center opacity-40 px-2 pt-1 text-xs tracking-widest uppercase font-serif text-stone-600">
<span>Nuestra Boda</span>
<span class="tracking-normal font-sans">2025</span>
</header>
<!-- BEGIN: CentralWreathAndMonogram -->
<section class="relative flex flex-col items-center justify-center my-auto w-full max-w-[320px] aspect-square" data-purpose="monogram-emblem">
<!-- Circular Botanical SVG Frame replicating the delicate watercolor & gold rings -->
<svg aria-hidden="true" class="absolute inset-0 w-full h-full gold-glow pointer-events-none" fill="none" viewbox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Soft golden gradients for metallic rings -->
<lineargradient gradientunits="userSpaceOnUse" id="goldRing" x1="50" x2="350" y1="40" y2="360">
<stop offset="0%" stop-color="#DEB887" stop-opacity="0.5"></stop>
<stop offset="35%" stop-color="#C5A869" stop-opacity="0.95"></stop>
<stop offset="65%" stop-color="#F2DEB0" stop-opacity="1"></stop>
<stop offset="100%" stop-color="#A58448" stop-opacity="0.6"></stop>
</lineargradient>
<lineargradient id="sageLeafGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#95A88F" stop-opacity="0.8"></stop>
<stop offset="50%" stop-color="#6F8567" stop-opacity="0.85"></stop>
<stop offset="100%" stop-color="#4F644A" stop-opacity="0.9"></stop>
</lineargradient>
<lineargradient id="eucalyptusBlush" x1="0%" x2="100%" y1="100%" y2="0%">
<stop offset="0%" stop-color="#C3A595" stop-opacity="0.5"></stop>
<stop offset="100%" stop-color="#849980" stop-opacity="0.85"></stop>
</lineargradient>
<lineargradient id="softStem" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#B2A183"></stop>
<stop offset="100%" stop-color="#847355"></stop>
</lineargradient>
</defs>
<!-- Dynamic Multi-Ring Geometric Base -->
<circle cx="200" cy="198" opacity="0.85" r="142" stroke="url(#goldRing)" stroke-width="1.6"></circle>
<circle cx="203" cy="201" opacity="0.6" r="148" stroke="url(#goldRing)" stroke-dasharray="320 6" stroke-width="1.2"></circle>
<circle cx="196" cy="195" opacity="0.45" r="136" stroke="#D1B880" stroke-width="0.8"></circle>
<!-- BEGIN: Botanical Leaves (Top-Right Wreath Cluster) -->
<g class="botanical-branch-top-right">
<!-- Main subtle branch arch -->
<path d="M 230 65 C 290 85 345 135 352 205" fill="none" stroke="url(#softStem)" stroke-linecap="round" stroke-width="1.2"></path>
<!-- Delicate Eucalyptus & Olive leaves -->
<!-- Leaf 1 -->
<path d="M 255 75 C 265 60 285 62 292 73 C 285 88 268 85 255 75 Z" fill="url(#sageLeafGrad)"></path>
<line opacity="0.7" stroke="#485B43" stroke-width="0.6" x1="258" x2="286" y1="75" y2="72"></line>
<!-- Leaf 2 - Dusty Rose/Eucalyptus blush -->
<path d="M 285 92 C 305 82 322 92 320 108 C 304 115 292 105 285 92 Z" fill="url(#eucalyptusBlush)"></path>
<!-- Leaf 3 -->
<path d="M 315 125 C 335 120 348 135 345 152 C 330 155 320 142 315 125 Z" fill="url(#sageLeafGrad)"></path>
<line opacity="0.7" stroke="#485B43" stroke-width="0.5" x1="318" x2="341" y1="128" y2="145"></line>
<!-- Leaf 4 - Soft Pointed Olive -->
<path d="M 335 160 C 358 160 366 178 358 195 C 344 192 338 178 335 160 Z" fill="url(#sageLeafGrad)"></path>
<!-- Leaf 5 - Lower hanging leaf -->
<path d="M 345 200 C 362 210 358 230 346 242 C 336 230 336 215 345 200 Z" fill="url(#eucalyptusBlush)" opacity="0.9"></path>
<!-- Golden Sprigs/Berries Accent -->
<circle cx="280" cy="80" fill="#D8BE7A" r="2.2"></circle>
<circle cx="310" cy="114" fill="#D8BE7A" r="2"></circle>
<circle cx="342" cy="175" fill="#D8BE7A" r="2.5"></circle>
<circle cx="330" cy="225" fill="#C5A869" r="1.8"></circle>
</g>
<!-- END: Botanical Leaves (Top-Right) -->
<!-- BEGIN: Botanical Leaves (Bottom-Left Wreath Cluster) -->
<g class="botanical-branch-bottom-left">
<!-- Main branch arch -->
<path d="M 170 338 C 110 320 60 265 52 195" fill="none" stroke="url(#softStem)" stroke-linecap="round" stroke-width="1.2"></path>
<!-- Leaf 1 -->
<path d="M 150 325 C 135 340 115 338 108 327 C 115 312 132 315 150 325 Z" fill="url(#sageLeafGrad)"></path>
<line opacity="0.7" stroke="#485B43" stroke-width="0.6" x1="145" x2="114" y1="324" y2="328"></line>
<!-- Leaf 2 - Olive Leaf -->
<path d="M 115 308 C 95 318 78 308 80 292 C 96 285 108 295 115 308 Z" fill="url(#eucalyptusBlush)"></path>
<!-- Leaf 3 -->
<path d="M 85 275 C 65 280 52 265 55 248 C 70 245 80 258 85 275 Z" fill="url(#sageLeafGrad)"></path>
<line opacity="0.7" stroke="#485B43" stroke-width="0.5" x1="82" x2="59" y1="272" y2="255"></line>
<!-- Leaf 4 -->
<path d="M 65 240 C 42 240 34 222 42 205 C 56 208 62 222 65 240 Z" fill="url(#eucalyptusBlush)"></path>
<!-- Leaf 5 -->
<path d="M 55 200 C 38 190 42 170 54 158 C 64 170 64 185 55 200 Z" fill="url(#sageLeafGrad)"></path>
<!-- Golden accent details -->
<circle cx="120" cy="320" fill="#D8BE7A" r="2.2"></circle>
<circle cx="90" cy="286" fill="#D8BE7A" r="2"></circle>
<circle cx="58" cy="225" fill="#D8BE7A" r="2.5"></circle>
<circle cx="70" cy="175" fill="#C5A869" r="1.8"></circle>
</g>
<!-- END: Botanical Leaves (Bottom-Left) -->
</svg>
<!-- Monogram and Wedding Date Typography container -->
<div class="relative z-10 flex flex-col items-center justify-center text-center px-4">
<!-- Calligraphic Monogram 'A y M' -->
<div class="font-script text-6xl sm:text-7xl text-stone-700 tracking-wide select-none transform hover:scale-105 transition-transform duration-500 py-1" data-purpose="initials-monogram" style="color: #795F45;">
<span class="inline-block transform -translate-x-1">A</span>
<span class="font-serif italic font-normal text-3xl sm:text-4xl px-2 opacity-80 inline-block align-middle" style="color: #9A7B56;">y</span>
<span class="inline-block transform translate-x-1">M</span>
</div>
<!-- Wedding Date with delicate typography separation -->
<time class="mt-2 font-serif text-lg tracking-[0.22em] text-[#8C6F4F] font-medium" data-purpose="wedding-date" datetime="2025-07-06">
          06 · 07 · 2025
        </time>
</div>
</section>
<!-- END: CentralWreathAndMonogram -->
<!-- BEGIN: InvitationFooterActions -->
<footer class="w-full flex flex-col items-center gap-6 pb-4">
<!-- Subtle downward indicator icon matching the screenshot -->
<div aria-hidden="true" class="animate-bounce-slow flex flex-col items-center justify-center text-stone-400 cursor-default" data-purpose="scroll-indicator">
<svg class="w-5 h-5 opacity-60" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M19.5 8.25l-7.5 7.5-7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Main Action Pill Button in refined terracotta tone -->
<button class="w-full max-w-[290px] py-4 px-6 rounded-full bg-[#A67C52] hover:bg-[#936C45] active:bg-[#7D5B38] text-white font-serif tracking-[0.08em] text-[17px] text-center shadow-lg shadow-[#a67c5240] hover:shadow-xl hover:shadow-[#a67c5255] transition-all duration-300 transform active:scale-95 focus:outline-none focus:ring-2 focus:ring-[#C5A869] focus:ring-offset-2" data-purpose="enter-invitation-btn" id="enter-button" type="button">
<span class="relative z-10 flex items-center justify-center gap-2">
<span>Ingresar a mi invitación</span>
</span>
</button>
<!-- Discreet RSVP / Couple tag -->
<p class="font-serif italic text-xs text-stone-500 tracking-wider">
        Andrés &amp; Margot
      </p>
</footer>
<!-- END: InvitationFooterActions -->
<!-- BEGIN: ModalWelcomeScreen (Appears on Click) -->
<div class="absolute inset-0 bg-[#FAF7F2]/95 backdrop-blur-sm z-50 flex flex-col justify-center items-center p-8 text-center opacity-0 pointer-events-none transition-opacity duration-700" data-purpose="welcome-modal-overlay" id="welcome-overlay">
<div class="max-w-xs flex flex-col items-center">
<!-- Golden wax seal emblem icon -->
<div class="w-16 h-16 rounded-full bg-[#A67C52] flex items-center justify-center shadow-md mb-6 text-white font-serif text-2xl border-2 border-[#FAF7F2] outline outline-2 outline-[#C5A869]">
          💍
        </div>
<h2 class="font-serif text-3xl text-stone-800 font-light mb-2">¡Bienvenidos!</h2>
<p class="font-serif italic text-stone-600 mb-6 text-lg leading-relaxed">
          Nos llena de alegría compartir este día tan especial con ustedes.
        </p>
<div class="w-12 h-0.5 bg-[#C5A869]/60 mb-6"></div>
<p class="font-sans text-xs uppercase tracking-widest text-stone-500 font-medium">
          Cargando experiencia nupcial...
        </p>
</div>
</div>
<!-- END: ModalWelcomeScreen -->
</main>
<!-- END: MobileDeviceContainer -->
<!-- BEGIN: InteractiveScripts -->
<script data-purpose="interaction-handling">
    document.addEventListener('DOMContentLoaded', () => {
      const enterBtn = document.getElementById('enter-button');
      const overlay = document.getElementById('welcome-overlay');
      const container = document.getElementById('invite-container');

      if (enterBtn && overlay) {
        enterBtn.addEventListener('click', () => {
          // Elegant tap vibration feedback if supported
          if (navigator.vibrate) {
            navigator.vibrate(35);
          }

          // Trigger smooth opening overlay transition
          overlay.classList.remove('opacity-0', 'pointer-events-none');
          overlay.classList.add('opacity-100', 'pointer-events-auto');

          // Optional callback simulation after unlocking
          setTimeout(() => {
            enterBtn.innerHTML = '<span>Abriendo...</span>';
          }, 400);
        });
      }
    });
  </script>
<!-- END: InteractiveScripts -->
</body></html>
